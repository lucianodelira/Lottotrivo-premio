<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lotto Trivo · Chat Bot Completo</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #141a22;
    --border: #1e2a3a;
    --text: #e8eef7;
    --muted: #8b9bb4;
    --primary: #3b82f6;
    --bot: #1e293b;
    --accent: #22d3ee;
    --success: #10b981;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #0f1520;
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bot-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #22d3ee);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .header-info h1 { font-size: 16px; font-weight: 700; }
  .header-info p { font-size: 12px; color: var(--muted); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); display: inline-block; margin-right: 5px;
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 110px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 92%;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.bot { align-self: flex-start; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #22d3ee);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }

  .bubble {
    background: var(--bot);
    border: 1px solid var(--border);
    border-radius: 18px 18px 18px 5px;
    padding: 13px 15px;
    font-size: 14px;
    line-height: 1.5;
  }
  .bubble .title {
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .bubble .time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }

  .numeros-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .num-chip {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 700;
    font-size: 13.5px;
  }
  .num-chip.hot { border-color: #22d3ee; color: #67e8f9; }
  .num-chip.ok  { border-color: #10b981; color: #6ee7b7; }
  .num-chip.warn{ border-color: #f59e0b; color: #fcd34d; }

  .info-box {
    background: #0f172a;
    border-radius: 10px;
    padding: 11px;
    margin-top: 8px;
    font-size: 13px;
  }
  .info-box .linha {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .info-box .linha:last-child { margin-bottom: 0; }

  .grupo-box {
    background: #0f172a;
    border-left: 3px solid #10b981;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
  }
  .grupo-box .grupo-title {
    font-weight: 700;
    color: #6ee7b7;
    margin-bottom: 6px;
    font-size: 13px;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0f1520;
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    display: flex;
    gap: 8px;
  }
  .action-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: white;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
  }
  .btn-secondary {
    background: var(--card);
    border: 1px solid var(--border);
  }

  .empty-chat {
    text-align: center;
    color: var(--muted);
    padding: 80px 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 7px; height: 7px;
    background: #64748b;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="bot-avatar">🤖</div>
  <div class="header-info">
    <h1>Lotto Trivo Bot</h1>
    <p><span class="status-dot"></span>Online · Dados da Planilha</p>
  </div>
</div>

<!-- CHAT -->
<div class="chat-container" id="chat-messages">
  <div class="empty-chat">
    Olá! Eu sou o <strong>Lotto Trivo Bot</strong>.<br><br>
    Toque em <strong>“Gerar Análise Completa”</strong><br>
    e eu te envio todos os palpites, grupos, resultados e acertos baseados na planilha.
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="action-btn btn-secondary" onclick="limparChat()">🗑️ Limpar</button>
  <button class="action-btn btn-primary" onclick="gerarAnaliseCompleta()">💬 Gerar Análise Completa</button>
</div>

<script>
/***************************************************************
 * CONFIGURAÇÃO - SUBSTITUA PELA URL DO SEU GOOGLE APPS SCRIPT
 ***************************************************************/
const API_URL = 'https://script.google.com/macros/s/AKfycbxXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';

/***************************************************************
 * FUNÇÕES DE CHAT
 ***************************************************************/
function adicionarMensagem(html, mostrarTyping = false) {
  const container = document.getElementById('chat-messages');
  const empty = container.querySelector('.empty-chat');
  if (empty) empty.remove();

  const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  const msg = document.createElement('div');
  msg.className = 'message bot';
  msg.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      ${html}
      <div class="time">${agora}</div>
    </div>
  `;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

function mostrarTyping() {
  const container = document.getElementById('chat-messages');
  const typing = document.createElement('div');
  typing.className = 'message bot';
  typing.id = 'typing-indicator';
  typing.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;
}

function removerTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function limparChat() {
  document.getElementById('chat-messages').innerHTML = `
    <div class="empty-chat">
      Chat limpo.<br>Toque em <strong>“Gerar Análise Completa”</strong> para começar.
    </div>`;
}

/***************************************************************
 * API
 ***************************************************************/
async function api(action, timeout = 50000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(`${API_URL}?action=${action}`, {
      method: 'GET',
      signal: controller.signal
    });
    clearTimeout(id);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

/***************************************************************
 * ANÁLISE COMPLETA DO BOT
 ***************************************************************/
async function gerarAnaliseCompleta() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';

  // 1. Saudação
  adicionarMensagem(`Olá! Vou analisar <strong>todos os dados da planilha</strong> e te enviar os palpites mais importantes.`);
  await delay(900);

  // 2. Coletar dados
  mostrarTyping();
  try {
    await api('coletar', 90000);
    removerTyping();
    adicionarMensagem(`✅ <strong>Coleta finalizada!</strong><br>Dados atualizados da planilha.`);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Não consegui coletar agora.<br>Continuando com os dados já salvos na planilha.`);
  }
  await delay(800);

  // 3. Sugestão Principal
  mostrarTyping();
  try {
    const r = await api('previsao');
    removerTyping();
    const sugestao = r.sugestao || [];

    let chips = '<div class="numeros-grid">';
    sugestao.forEach(n => chips += `<div class="num-chip hot">${n}</div>`);
    chips += '</div>';

    adicionarMensagem(`
      <div class="title">🎯 Sugestão Principal (Frequência + Padrões)</div>
      Estes são os 10 números mais fortes de acordo com a análise da planilha:
      ${chips}
    `);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`❌ Erro ao gerar sugestão: ${e.message}`);
  }
  await delay(1000);

  // 4. Palpitão (20 dezenas)
  mostrarTyping();
  try {
    const r = await api('palpitao');
    removerTyping();
    const dezenas = r.dezenas || [];
    const a = r.analitico || {};

    let chips = '<div class="numeros-grid">';
    dezenas.forEach(d => chips += `<div class="num-chip warn">${d.dezena}</div>`);
    chips += '</div>';

    adicionarMensagem(`
      <div class="title">🔥 Palpitão – 20 Dezenas que mais saem</div>
      Baseado em frequência histórica da planilha:<br>
      ${chips}
      <div class="info-box" style="margin-top:10px;">
        <div class="linha"><span>Média de acertos</span><strong>${a.mediaAcertos || 0}</strong></div>
        <div class="linha"><span>Taxa ≥ 10 acertos</span><strong>${a.taxaAcima10 || 0}%</strong></div>
        <div class="linha"><span>Melhor resultado</span><strong>${a.melhor || 0}</strong></div>
        <div class="linha"><span>Pior resultado</span><strong>${a.pior || 0}</strong></div>
      </div>
    `);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Não consegui carregar o Palpitão.`);
  }
  await delay(1000);

  // 5. Grupos mais atrasados + milhares
  mostrarTyping();
  try {
    const r = await api('palpite_grupos');
    removerTyping();
    const grupos = r.grupos || [];

    let html = `<div class="title">🎲 Grupos mais atrasados + 4 milhares cada</div>`;
    html += `Aqui estão os 10 grupos com maior atraso e as milhares mais fortes de cada um:<br><br>`;

    grupos.slice(0, 6).forEach(g => {
      html += `<div class="grupo-box">
        <div class="grupo-title">Grupo ${g.grupo} · Atraso: ${g.atraso} sorteios</div>
        <div class="numeros-grid">`;
      (g.milhares || []).forEach(m => {
        html += `<div class="num-chip">${m.milhar}</div>`;
      });
      html += `</div></div>`;
    });

    adicionarMensagem(html);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Não consegui carregar os grupos atrasados.`);
  }
  await delay(1000);

  // 6. Top Atrasados (resumo)
  mostrarTyping();
  try {
    const r = await api('atrasados');
    removerTyping();

    const milhar = (r.milhar || []).slice(0, 5).map(i => i.valor).join(' · ');
    const centena = (r.centena || []).slice(0, 5).map(i => i.valor).join(' · ');
    const dezena = (r.dezena || []).slice(0, 5).map(i => i.valor).join(' · ');
    const grupo = (r.grupo || []).slice(0, 5).map(i => i.valor).join(' · ');

    adicionarMensagem(`
      <div class="title">⏳ Top 5 mais atrasados</div>
      <div class="info-box">
        <div class="linha"><span>🎯 Milhar</span><strong style="font-size:12px;">${milhar || '—'}</strong></div>
        <div class="linha"><span>🔢 Centena</span><strong style="font-size:12px;">${centena || '—'}</strong></div>
        <div class="linha"><span>📶 Dezena</span><strong style="font-size:12px;">${dezena || '—'}</strong></div>
        <div class="linha"><span>🎲 Grupo</span><strong style="font-size:12px;">${grupo || '—'}</strong></div>
      </div>
    `);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Não consegui carregar os atrasados.`);
  }
  await delay(900);

  // 7. Último Resultado
  mostrarTyping();
  try {
    const r = await api('resultados');
    removerTyping();

    if (r.resultados && r.resultados.length) {
      const ultimo = r.resultados[0];
      let chips = '<div class="numeros-grid">';
      (ultimo.numeros || []).forEach(n => {
        if (n) chips += `<div class="num-chip">${n}</div>`;
      });
      chips += '</div>';

      adicionarMensagem(`
        <div class="title">📋 Último Resultado Oficial</div>
        <strong>${ultimo.data || ''} · ${ultimo.hora || ''}</strong><br>
        ${chips}
      `);
    } else {
      adicionarMensagem(`📋 Ainda não há resultados recentes na planilha.`);
    }
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Não consegui carregar o último resultado.`);
  }
  await delay(900);

  // 8. Acertos
  mostrarTyping();
  try {
    const r = await api('verificar');
    removerTyping();
    const s = r.resumo || {};
    const sorteio = r.sorteio || {};

    adicionarMensagem(`
      <div class="title">✅ Acertos da última previsão</div>
      Comparação com o sorteio real:
      <div class="info-box">
        <div class="linha"><span>Milhar</span><strong>${s.milhar || 0}</strong></div>
        <div class="linha"><span>Centena</span><strong>${s.centena || 0}</strong></div>
        <div class="linha"><span>Dezena</span><strong>${s.dezena || 0}</strong></div>
        <div class="linha"><span>Grupo</span><strong>${s.grupo || 0}</strong></div>
        <div class="linha"><span>Sugestão (milhar)</span><strong>${s.sugestao || 0}</strong></div>
        <div class="linha"><span>Sugestão (centena)</span><strong>${s.sugestao_centena || 0}</strong></div>
      </div>
    `);
  } catch (e) {
    removerTyping();
    adicionarMensagem(`⚠️ Ainda não há previsão fechada para verificar acertos.`);
  }

  await delay(700);
  adicionarMensagem(`Pronto! Análise completa baseada na planilha.<br><br>Se quiser atualizar tudo de novo, é só tocar em <strong>Gerar Análise Completa</strong> 🚀`);
}
</script>
</body>
</html>
